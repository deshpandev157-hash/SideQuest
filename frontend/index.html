<!DOCTYPE html>
<html>
<head>
    <title>SideQuest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <h1 class="logo">SideQuest</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<h2 style="text-align:center;">Trending Now</h2>

<div class="container" id="content"></div>

<script>
fetch("http://127.0.0.1:5000/api/auth/all_content")
.then(res => res.json())
.then(data => {
    let html = "";
    data.forEach(item => {
        html += `
        <div class="card">
    <img src="${item.poster}">
    <h3>${item.title}</h3>

    <button onclick="openReview(${item.id})">Add Review</button>
</div>
        `;
    });
   document.getElementById("content").innerHTML = html;
});
function openReview(id){
    window.location = "review.html?id=" + id;
}
</script>

</body>
</html>

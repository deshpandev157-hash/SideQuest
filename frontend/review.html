<!DOCTYPE html>
<html>
<head>
    <title>Add Review - SideQuest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 style="text-align:center;">Add Your Review</h2>

<div style="width:300px;margin:50px auto;">
    <input id="rating" type="number" min="1" max="10" placeholder="Rating (1-10)">
    <textarea id="comment" placeholder="Write your review"></textarea>

    <button onclick="submitReview()">Submit</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const contentId = params.get("id");

function submitReview(){
    fetch("http://127.0.0.1:5000/api/auth/add_review",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            rating:document.getElementById("rating").value,
            comment:document.getElementById("comment").value,
            user_id:1,
            content_id:contentId
        })
    })
    .then(res=>res.json())
    .then(data=>{
        alert(data.message);
        window.location="index.html";
    });
}
</script>

</body>
</html>

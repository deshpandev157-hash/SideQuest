<!DOCTYPE html>
<html>
<head>
    <title>Login - SideQuest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <h1 class="logo">SideQuest</h1>
</header>

<div style="width:300px;margin:80px auto;background:#111827;padding:25px;border-radius:10px;box-shadow:0 0 20px #00e5ff;">
    <h2 style="text-align:center;">Login</h2>

    <input id="email" placeholder="Email" style="width:100%;padding:10px;margin:10px 0;background:black;border:1px solid #00e5ff;color:white;">
    <input id="password" type="password" placeholder="Password" style="width:100%;padding:10px;margin:10px 0;background:black;border:1px solid #00e5ff;color:white;">

    <button onclick="login()" style="width:100%;padding:10px;background:#00e5ff;border:none;font-weight:bold;cursor:pointer;">Login</button>
</div>

<script src="script.js"></script>
</body>
</html>
